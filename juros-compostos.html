<!-- Seção de Resultados -->
<section class="results-section">
    <h2>Resultados da Simulação</h2>
    <div class="summary-cards">
        <div class="card">
            <h3>Valor Total Acumulado</h3>
            <p id="total-accumulated">R$ 0,00</p>
        </div>
        <div class="card">
            <h3>Total Investido</h3>
            <p id="total-invested">R$ 0,00</p>
        </div>
        <div class="card">
            <h3>Total em Juros</h3>
            <p id="total-interest">R$ 0,00</p>
        </div>
    </div>

    <!-- Container do Gráfico -->
    <div class="chart-container" style="position: relative; height:400px; width:100%; margin-top: 30px;">
        <canvas id="compoundChart"></canvas>
    </div>

    <!-- Tabela Mês a Mês -->
    <div class="table-container" style="margin-top: 40px; overflow-x: auto;">
        <h3>Evolução Mês a Mês</h3>
        <table id="results-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 2px solid #ccc;">
                    <th style="padding: 10px;">Mês</th>
                    <th style="padding: 10px;">Valor Aplicado no Mês</th>
                    <th style="padding: 10px;">Total Investido</th>
                    <th style="padding: 10px;">Juros do Mês</th>
                    <th style="padding: 10px;">Total em Juros</th>
                    <th style="padding: 10px;">Valor Total</th>
                </tr>
            </thead>
            <tbody>
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>
</section>

<!-- Importando a biblioteca Chart.js via CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
